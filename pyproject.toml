[project]
name = "walmart-sales-intelligence"
version = "0.1.0"
description = "Walmart weekly sales analytics, forecasting and dashboard"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
